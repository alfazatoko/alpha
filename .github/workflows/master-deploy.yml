name: Full Deployment (Web & Android)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # JOB 1: Build & Deploy Website
  deploy-web:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALFALIA }}'
          channelId: live
          projectId: alfalia
        continue-on-error: true

  # JOB 2: Build APK Android (RELEASE)
  build-android:
    name: Build Android APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Run Signing Report (Untuk Ambil SHA-1)
        working-directory: ./android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew signingReport
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK (Mode Release)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALFAZA-ALPHA-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (Download Langsung APK)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.5.4
          name: "ALFAZA ALPHA POS v1.5.4"
          body: |
            ### Pembaruan Aplikasi v1.5.4
            - **Integrasi Database Online & Built-in Fee Aplikasi Transaksi:** Penanaman langsung (built-in) nilai nominal fee aplikasi untuk pilihan tujuan transaksi PPOB & E-Wallet (DANA +200, GOPAY +900, OVO +700, SHOPEEPAY +100, LINKAJA +800, MAXIM +2200, TOKEN LISTRIK +1850) sehingga langsung muncul di seluruh HP kasir.
            - **Tabel Khusus & Sinkronisasi Realtime Supabase:** Penyediaan tabel database terisolasi `store_popup_lists` dengan sinkronisasi instan multi-perangkat via Supabase Realtime saat ada perubahan pilihan dan fee aplikasi di form transaksi.
            - **Desain Grid & Tombol Kategori Minimalis:** Pengecilan lingkaran grid ikon kategori layanan agar lebih rapi, proporsional, dan minimalis.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
