name: Full Deployment (Web & Android)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # JOB 1: Build & Deploy Website
  deploy-web:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALFALIA }}'
          channelId: live
          projectId: alfalia
        continue-on-error: true

  # JOB 2: Build APK Android (RELEASE)
  build-android:
    name: Build Android APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Run Signing Report (Untuk Ambil SHA-1)
        working-directory: ./android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew signingReport
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK (Mode Release)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALFAZA-ALPHA-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (Download Langsung APK)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.5.2
          name: "ALFAZA ALPHA POS v1.5.2"
          body: |
            ### Pembaruan Aplikasi v1.5.2
            - **Standarisasi Rincian & Struk Transaksi:** Label informasi baris kedua seragam menggunakan **`Layanan / Produk:`** untuk semua kategori transaksi (Transfer Bank, Order Kuota, Tarik Tunai, Aksesoris, Voucher).
            - **Penyempurnaan Alur Kas Transaksi Aksesoris (Tunai vs Non Tunai/QRIS):**
              - *Bayar Tunai*: Sumber Uang Masuk otomatis masuk ke **Laci Kasir** dan terhitung dalam kas fisik laci.
              - *Bayar Non Tunai (QRIS)*: Sumber Uang Masuk tercatat **QRIS**, nominal berwarna **Ungu Kontras** dengan badge **NON TUNAI**, **100% dipisahkan dari laci kasir fisik** dan masuk ke **Kas Lain Nya / Non Tunai**.
              - Peniadaan baris admin fee Rp 0 dan pembersihan tag teknis `[Admin Dalam]` pada rincian struk aksesoris/barang toko.
              - Sumber uang keluar untuk aksesoris dan voucher disesuaikan menjadi strip (`—`) karena tidak memotong modal saldo server.
            - **Pemulihan Angka Denominasi Paket & Token Listrik:** Angka isi produk (seperti `ISI 20`, `ISI 25`, `ISI 50`) kini tampil utuh dan lengkap tanpa terpotong di riwayat transaksi maupun cetak struk kasir.
            - **Penyempurnaan Studio Desain Foto & Promosi AI:** Integrasi menyeluruh generator desain foto dan Canvas Editor (teks promo toko, banner warna, filter warna, watermark toko ALFAZA CELL, dan tombol unduh JPG).
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
