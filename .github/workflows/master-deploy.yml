name: Full Deployment (Web & Android)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # JOB 1: Build & Deploy Website
  deploy-web:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALFALIA }}'
          channelId: live
          projectId: alfalia
        continue-on-error: true

  # JOB 2: Build APK Android (RELEASE)
  build-android:
    name: Build Android APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Run Signing Report (Untuk Ambil SHA-1)
        working-directory: ./android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew signingReport
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK (Mode Release)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALFAZA-ALPHA-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (Download Langsung APK)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.5.1
          name: "ALFAZA ALPHA POS v1.5.1"
          body: |
            ### Pembaruan Aplikasi v1.5.1
            - **Popup Sub-Kategori Aksesoris Interaktif:** Pilihan sub-kategori aksesoris cepat (Charger, Kabel Data, Headset, Tempered Glass, dll) dengan kemampuan edit nama, hapus, dan tambah pilihan baru langsung dari kasir.
            - **Penyempurnaan Alur & Tampilan Non Tunai:** Sumber uang masuk otomatis tercatat Non Tunai/QRIS/Bank, label biaya admin non tunai, dan penegasan warna ungu pada nominal transaksi.
            - **Kerapian Catatan Riwayat Transaksi:** Format keterangan rapi tanpa duplikasi tag dan pembersihan teks otomatis.
            - **Panduan Ukuran Banner Promosi:** Tampilan panduan ukuran rekomendasi banner (1200 x 500 px, landscape) di menu akun & slider promo.
            - **Studio Buat Desain Foto JPG & Promosi AI:** Integrasi chatbot generator desain foto dan canvas editor.
            - **Studio Buat Desain Foto JPG & Promosi AI:** Integrasi menyeluruh generator desain foto dari teks percakapan chatbot tanpa penolakan teks AI, dilengkapi Canvas Editor (teks promo toko, banner warna, filter, rotasi, watermark ALFAZA CELL) dan tombol 1-klik unduh JPG langsung.
            - **Sinkronisasi Laporan Single Source of Truth:** Perbaikan selisih transaksi dan omzet antara Halaman Profit dan Grafik Performa menggunakan RPC Supabase.
            - **Bot Alpha AI Pintar:** Integrasi resmi Google Gemini AI (menjawab segala pertanyaan umum, konsultasi bisnis konter pulsa, dan strategi promosi).
            - **2 Pilihan Mode AI (Medium & High):**
              - *⚡ Medium (Penalaran Cepat)*: Model ultra-kilat Flash Lite untuk kasir saat melayani pelanggan (< 1.5 detik).
              - *🧠 High (Berpikir Panjang)*: Deep reasoning terstruktur untuk analisis bisnis & strategi owner.
            - **Studio Buat & Edit Foto AI:**
              - *Buat Foto*: Generate gambar/poster promosi konter otomatis dari teks prompt AI.
              - *Edit Foto*: Studio Canvas interaktif untuk menambahkan teks promo, banner warna, efek/filter warna, rotasi, dan watermark toko.
              - *Simpan Foto*: Tombol 1-klik unduh (download) langsung file foto JPG.
            - **Multimodal Camera Vision:** Kemampuan bot menganalisis foto struk/nota, barcode, dan foto produk fisik lewat tombol kamera.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
